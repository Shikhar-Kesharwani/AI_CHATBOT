[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

# ─────────────────────────────────────────────────────────────────────────────
# FastAPI Backend — runs on port 8000 (internal)
# Streamlit communicates with it via API_URL env var (default: localhost:8000)
# ─────────────────────────────────────────────────────────────────────────────
[program:fastapi]
command=python -m uvicorn src.main:app --host 0.0.0.0 --port 8000
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=1

# ─────────────────────────────────────────────────────────────────────────────
# Streamlit Frontend — runs on PORT env var (default: 7860 for Hugging Face)
# Render and Docker Compose override PORT via environment variable
# ─────────────────────────────────────────────────────────────────────────────
[program:streamlit]
command=python -m streamlit run streamlit_app/home.py --server.port=%(ENV_PORT)s --server.address=0.0.0.0 --server.headless=true
autostart=true
autorestart=true
startsecs=8
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=2
