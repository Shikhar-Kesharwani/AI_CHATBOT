version: '3.9'

# =============================================================================
# MODEL 2 — SELF-HOSTED DOCKER COMPOSE
# Runs the entire Adaptive RAG stack on any machine with Docker installed.
#
# Usage:
#   cp infra/docker/.env.example infra/docker/.env   (fill in your secrets)
#   docker-compose -f infra/docker/docker-compose.yml up -d
#
# Access:
#   Streamlit UI   → http://localhost
#   FastAPI Docs   → http://localhost/api/docs  (via Nginx proxy)
#   MinIO Console  → http://localhost:9001
# =============================================================================

services:

  # ─── Application (FastAPI + Streamlit via Supervisord) ───────────────────
  app:
    build:
      context: ../../
      dockerfile: Dockerfile
    container_name: adaptive_rag_app
    restart: unless-stopped
    environment:
      # Ports
      - PORT=8501                             # Streamlit exposed on 8501
      # API routing (Streamlit → FastAPI, internal loopback)
      - API_URL=http://localhost:8000
      # Persistent storage paths (mounted volume)
      - SQLITE_DB_PATH=/data/adaptive_rag.db
      - FAISS_INDEX_DIR=/data/faiss_index_persistent
      # AI keys (set in .env file)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      # CORS
      - ALLOWED_ORIGINS=http://localhost,http://localhost:8501
      # Monitoring (optional)
      - SENTRY_DSN=${SENTRY_DSN:-}
    volumes:
      # Persistent storage for SQLite DB and FAISS index
      - rag_data:/data
      - app_logs:/home/user/app/logs
    depends_on:
      minio:
        condition: service_started
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─── Object Storage (MinIO — Self-Hosted S3) ──────────────────────────────
  # Stores uploaded PDFs and documents persistently
  minio:
    image: minio/minio:latest
    container_name: adaptive_rag_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"    # S3 API
      - "9001:9001"    # MinIO Admin Console
    networks:
      - app_network

  # ─── Reverse Proxy (Nginx) ────────────────────────────────────────────────
  # Routes all public traffic to the correct service
  # / → Streamlit (port 8501)
  nginx:
    image: nginx:alpine
    container_name: adaptive_rag_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app_network

volumes:
  rag_data:          # Persistent SQLite DB + FAISS index
  minio_data:        # Persistent document uploads
  app_logs:          # Application logs

networks:
  app_network:
    driver: bridge
