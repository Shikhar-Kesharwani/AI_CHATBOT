version: '3.9'

# Production-hardened overrides. Run with:
# docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  app:
    restart: always
    environment:
      - DEBUG=False
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

  nginx:
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_certs:/etc/nginx/certs

  minio:
    restart: always

volumes:
  nginx_certs:
